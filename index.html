<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="run-planner-version" content="2026.07.28.4">
<title>Run Planner Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script data-goatcounter="https://runplanhacker.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style>
  :root{--ink:#17211b;--muted:#657268;--line:#dbe5dd;--soft:#f4f8f4;--panel:#fffef9;--route:#1f8fff;--mint:#22c55e;--sun:#f59e0b;--coral:#ef5f4a;--panel-shift:-430px;}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:100%;height:100%;overflow:hidden;background:#eaf4ef;color:var(--ink);font-family:Arial,Helvetica,sans-serif;}
  button,input,select{font:inherit;color:var(--ink);}
  #map{position:fixed;inset:0;width:100vw;height:100dvh;background:#fff;}
  .leaflet-container{font:inherit;}
  .leaflet-control-attribution{font-size:10px;}
  .drawer{--tab-width:44px;--tab-height:112px;position:fixed;left:0;top:14px;z-index:1000;width:min(420px,calc(100vw - 76px));filter:drop-shadow(0 18px 50px rgba(30,45,36,.22));transition:transform .28s cubic-bezier(.2,.8,.2,1);}
  .drawer::before{content:"";position:absolute;left:0;top:0;z-index:4;width:100%;height:7px;border-radius:28px 0 0 0;background:linear-gradient(90deg,var(--mint),var(--route),var(--sun),var(--coral));pointer-events:none;}
  .drawer.closed{transform:translateX(var(--panel-shift));}
  .drawer-tab{position:absolute;top:0;right:calc(0px - var(--tab-width));z-index:2;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.75);border-left:0;border-radius:0 22px 22px 0;background:linear-gradient(180deg,#17211b,#1b6f64);color:#fff;width:var(--tab-width);height:var(--tab-height);padding:7px 0 0;font-size:26px;font-weight:900;line-height:1;cursor:pointer;backdrop-filter:blur(14px);}
  .drawer-tab:hover{background:linear-gradient(180deg,#22322a,#16857a);}
  .panel{position:relative;width:100%;max-height:calc(100dvh - 28px);overflow:auto;border:1px solid rgba(255,255,255,.75);border-radius:28px 0 28px 28px;background:rgba(255,254,249,.94);box-shadow:none;backdrop-filter:blur(14px);}
  .panel-inner{display:grid;gap:12px;padding:23px 14px 14px;}
  .pane-block{display:grid;gap:12px;border:1px solid rgba(219,229,221,.9);border-radius:22px;background:rgba(255,255,255,.76);padding:12px;box-shadow:0 8px 22px rgba(30,45,36,.08);}
  .route-panel{background:linear-gradient(180deg,#fffef9,#f3fbf5);}
  .filter-panel{background:linear-gradient(180deg,#ffffff,#f7f9ff);}
  .topline{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;padding-bottom:4px;}
  h1{font-size:23px;line-height:1.05;letter-spacing:.01em;}
  .title-area{display:grid;gap:8px;}
  .lang-switch{display:inline-grid;grid-template-columns:1fr 1fr;width:132px;border-radius:999px;background:#e8f0ea;padding:3px;}
  .lang-switch button{border:0;border-radius:999px;background:transparent;min-height:30px;font-size:12px;font-weight:900;cursor:pointer;color:#52645a;}
  .lang-switch button.active{background:var(--ink);color:#fff;}
  .meta{font-size:11px;color:var(--muted);line-height:1.25;}
  .pane-meta{border-top:1px solid #e5eee8;padding-top:8px;}
  .control{display:grid;gap:4px;}
  label{font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;}
  input,select{width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:10px 12px;min-height:42px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  input:focus,select:focus{outline:3px solid rgba(34,197,94,.2);border-color:#5fcf83;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .run-settings{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(104px,.95fr);align-items:start;}
  .run-settings input,.run-settings select,.estimate-box{height:42px;min-height:42px;font-size:15px;font-weight:700;line-height:1.2;}
  .run-settings input,.run-settings select{padding-top:9px;padding-bottom:9px;}
  .select-wrap{position:relative;}
  .select-wrap select{appearance:none;-webkit-appearance:none;padding-right:30px;}
  .select-wrap::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid #657268;border-bottom:2px solid #657268;transform:translateY(-65%) rotate(45deg);pointer-events:none;}
  .estimate-box{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--line);border-radius:15px;background:#fff;padding:9px 10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .estimate-value{font-size:15px;font-weight:700;line-height:1.2;color:var(--ink);white-space:nowrap;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .btn{border:0;border-radius:16px;background:#fff;padding:10px;min-height:42px;cursor:pointer;font-size:14px;font-weight:900;box-shadow:0 6px 18px rgba(30,45,36,.1);}
  .btn:hover{transform:translateY(-1px);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn.primary{background:linear-gradient(135deg,#16a34a,#20c997);color:#fff;}
  .btn.accent{background:linear-gradient(135deg,#ff7a59,#f59e0b);color:#fff;}
  .btn.ghost{background:#eef6f0;color:#274334;}
  .btn.compact{min-height:38px;padding:8px;font-size:12px;}
  .route-draw-controls{display:grid;gap:8px;border-top:1px solid #e5eee8;padding-top:10px;}
  .route-draw-topline{display:flex;align-items:center;gap:10px;min-height:42px;}
  .tool-btn{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border:0;border-radius:14px;background:#eef6f0;color:#274334;cursor:pointer;box-shadow:0 6px 18px rgba(30,45,36,.1);}
  .tool-btn:hover{transform:translateY(-1px);}
  .tool-btn.active{background:linear-gradient(135deg,#17211b,#1b6f64);color:#fff;}
  .tool-btn svg{width:20px;height:20px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .route-mode-text{flex:1;min-width:0;font-size:12px;font-weight:900;color:#415247;line-height:1.25;}
  .route-distance-box{display:flex;align-items:center;justify-content:center;min-width:86px;height:38px;border:1px solid var(--line);border-radius:15px;background:#fff;padding:8px 10px;font-size:15px;font-weight:700;line-height:1.2;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.7);}
  .route-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
  .route-footnote{font-size:11px;color:#647267;line-height:1.35;}
  .chips{display:flex;gap:7px;flex-wrap:wrap;}
  .chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid transparent;border-radius:999px;background:#eef4ef;color:#435348;padding:8px 10px;min-height:36px;font-size:12px;font-weight:900;cursor:pointer;user-select:none;transition:background .18s ease,color .18s ease,box-shadow .18s ease;}
  .chip.active{background:#17211b;color:#fff;box-shadow:0 8px 20px rgba(23,33,27,.16);}
  .chip input{position:absolute;opacity:0;pointer-events:none;}
  .chip span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border:1px solid var(--ink);border-radius:50%;display:inline-block;}
  .chip.active .dot{border-color:#fff;}
  .map-element-list{display:grid;grid-template-columns:1fr;gap:7px;border-radius:18px;background:linear-gradient(135deg,#f7fbf8,#fff7e8);padding:10px;border:1px solid #edf1e9;}
  .map-element-btn{position:relative;display:grid;grid-template-columns:auto minmax(38px,max-content) minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;border:1px solid transparent;border-radius:14px;background:#eef4ef;color:#405146;padding:9px 10px;min-height:40px;font-size:12px;font-weight:800;line-height:1.2;text-align:left;cursor:pointer;user-select:none;transition:background .18s ease,color .18s ease,box-shadow .18s ease,border-color .18s ease;}
  .map-element-btn.active{background:#17211b;color:#fff;box-shadow:0 8px 20px rgba(23,33,27,.16);}
  .map-element-btn.disabled{opacity:.52;cursor:not-allowed;box-shadow:none;}
  .map-element-btn input{position:absolute;opacity:0;pointer-events:none;}
  .map-element-btn.active .dot{border-color:#fff;}
  .map-element-code{font-weight:900;white-space:nowrap;}
  .map-element-name{min-width:0;overflow-wrap:anywhere;}
  .map-element-count{font-size:11px;font-weight:800;color:inherit;opacity:.72;white-space:nowrap;}
  .label-hint{text-transform:none;letter-spacing:0;font-size:11px;font-weight:700;color:var(--muted);}
  .status{border-top:1px solid #e5eee8;padding-top:8px;font-size:12px;color:var(--muted);min-height:26px;}
  .marker{width:24px;height:24px;border:2px solid #fff;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.28);}
  .convenience-marker{width:30px;height:22px;border-radius:999px;font-size:8px;border-width:2px;opacity:.96;}
  .runner-marker{width:32px;height:32px;border:2px solid #fff;border-radius:50%;background:#111f18;display:flex;align-items:center;justify-content:center;font-size:18px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.32);}
  .bathroom-marker{width:30px;height:30px;border:2px solid #fff;border-radius:50%;background:#0f766e;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.32);}
  .cycle-port-marker{width:30px;height:30px;border:3px solid #ff2020;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:18px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.32);}
  .cycle-port-marker > span{display:block;line-height:1;transform:translateY(-1px);}
  .brand-af{background:#7b1fa2;}
  .brand-wg{background:#006323;}
  .brand-cr{background:#d97706;}
  .brand-sb{background:#006241;}
  .brand-fm{background:#0b74ff;}
  .brand-seven{background:#e23d28;}
  .station-dot{background:#111;border-color:#111;}
  .bathroom-dot{background:#0f766e;border-color:#0f766e;}
  .cycle-port-dot{background:#ff2020;border-color:#ff2020;}
  .rain-radar-dot{background:linear-gradient(135deg,#88ddee,#00a3e0,#ffee00,#c10000);border-color:#fff;}
  .major-station-icon{background:transparent;border:0;pointer-events:none;}
  .major-station-label{display:inline-block;max-width:145px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:4px;background:rgba(10,10,10,.88);color:#fff;padding:3px 7px;font-size:14px;font-weight:400;line-height:1.2;box-shadow:0 2px 7px rgba(0,0,0,.24);pointer-events:none;}
  .popup{min-width:210px;max-width:280px;border-radius:18px;}
  .popup b{display:block;font-size:14px;margin-bottom:4px;}
  .popup p{font-size:12px;margin:0 0 6px;color:#333;}
  .popup a{display:inline-flex;margin-right:10px;font-size:12px;color:#050505;font-weight:800;}
  .route-popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  .route-popup-actions button{border:0;border-radius:12px;background:#eef6f0;color:#274334;padding:8px 10px;min-height:34px;font-size:12px;font-weight:900;cursor:pointer;}
  .route-popup-actions button.primary{border:1px solid #bfe8ca;background:#e8f8ec;color:#17341f;}
  .route-popup-actions button.accent{border:1px solid #f3c9bd;background:#fdebe5;color:#712417;}
  .route-popup-actions button:disabled{opacity:.45;cursor:not-allowed;}
  .leaflet-popup-content .route-distance-pop{min-width:92px;text-align:center;}
  .route-distance-pop b{display:block;margin:0 0 2px;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#657268;}
  .route-distance-pop span{display:block;font-size:15px;font-weight:900;color:#17211b;}
  .route-control-point{width:18px;height:18px;border:3px solid #fff;border-radius:50%;background:#1f8fff;box-shadow:0 3px 10px rgba(0,0,0,.28);}
  .route-control-point.start{background:#22c55e;}
  .route-control-point.end{background:#ef5f4a;}
  .leaflet-marker-draggable .route-control-point{cursor:grab;}
  .leaflet-drag-target .route-control-point{cursor:grabbing;}
  .route-visual-overlay{position:absolute;inset:0;z-index:450;width:100%;height:100%;overflow:hidden;pointer-events:none;}
  .route-visual-line{fill:none;stroke:#006dff;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;}
  .route-hit-target{pointer-events:stroke;}
  .bearing-reset-control{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border:0;background:#fff;color:#111;font-weight:900;line-height:1;cursor:pointer;}
  .bearing-reset-control.active{background:#fff;color:#111;box-shadow:inset 0 0 0 2px rgba(230,36,36,.18);}
  .bearing-reset-icon{display:flex;flex-direction:column;align-items:center;justify-content:center;width:26px;height:28px;transform:rotate(0deg);transition:transform .12s ease;}
  .bearing-reset-arrow{color:#e62424;font-size:16px;font-weight:900;line-height:.7;}
  .bearing-reset-letter{color:#111;font-size:12px;font-weight:900;line-height:1;}
  .site-qr-control{display:block;width:80px;height:80px;padding:5px;border:1px solid rgba(23,33,27,.24);border-radius:4px;background:#fff;box-shadow:0 3px 12px rgba(0,0,0,.2);line-height:0;}
  .site-qr-control img{display:block;width:100%;height:100%;}
  html[lang="ja"] .btn.primary,html[lang="ja"] .btn.accent,html[lang="ja"] .chip.active,html[lang="ja"] .lang-switch button.active{font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.24);}
  html[lang="ja"] .btn,html[lang="ja"] .chip{font-weight:700;}
  @media(max-width:700px){
    .drawer{--tab-width:40px;--tab-height:96px;left:0;top:calc(8px + env(safe-area-inset-top));width:calc(100vw - 54px);}
    .drawer::before{border-radius:24px 0 0 0;}
    .drawer-tab{border-radius:0 18px 18px 0;font-size:22px;}
    .panel{max-height:calc(100dvh - 16px - env(safe-area-inset-top) - env(safe-area-inset-bottom));border-radius:24px 0 24px 24px;}
    .panel-inner{gap:10px;padding:19px 10px 10px;}
    .pane-block{gap:10px;border-radius:20px;padding:10px;}
    .topline{align-items:center;}
    h1{font-size:19px;}
    .lang-switch{width:112px;}
    .actions{grid-template-columns:repeat(2,1fr);}
    .btn{font-size:12px;padding:7px 5px;}
    .map-element-btn{grid-template-columns:auto minmax(32px,max-content) minmax(0,1fr) auto;padding:9px;}
    .run-settings{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(96px,.95fr);gap:6px;}
    .run-settings input,.run-settings select,.estimate-box,.estimate-value{font-size:14px;}
    .estimate-box{padding:8px;}
    .site-qr-control{width:44px;height:44px;padding:3px;}
  }
</style>
</head>
<body>
<div id="map" aria-label="Run planner map"></div>
<div class="drawer open" id="drawer">
  <section class="panel" aria-label="Run planner controls">
    <div class="panel-inner">
      <div class="pane-block route-panel">
        <div class="topline">
          <div class="title-area">
            <h1 id="titleText">Run Planner</h1>
            <div class="lang-switch" aria-label="Language">
              <button type="button" id="langEn" class="active">EN</button>
              <button type="button" id="langJa">日本語</button>
            </div>
          </div>
        </div>
        <div class="control">
          <label for="locationInput" id="centerLabel">Center coordinates</label>
          <input id="locationInput" type="text" value="35.685175,139.752800" autocomplete="off">
        </div>
        <div class="row run-settings">
          <div class="control">
            <label for="radiusInput" id="radiusLabel">Radius km</label>
            <div class="select-wrap"><select id="radiusInput"></select></div>
          </div>
          <div class="control">
            <label for="paceInput" id="paceLabel">Pace min/km</label>
            <input id="paceInput" type="text" value="8:00">
          </div>
          <div class="control">
            <label id="loopStatLabel">Estimated time</label>
            <div class="estimate-box">
              <span class="estimate-value" id="timeMetric">-</span>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="btn ghost" id="loadBtn">Coords</button>
          <button class="btn primary" id="gpsBtn">GPS</button>
        </div>
        <div class="route-draw-controls" aria-label="Route drawing">
          <div class="route-draw-topline">
            <button class="tool-btn" id="routeDrawBtn" type="button" aria-pressed="false" title="Draw route">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
              </svg>
            </button>
            <span class="route-mode-text" id="routeModeText">Draw route</span>
            <span class="route-distance-box" id="routeDistanceMetric">0.00 km</span>
          </div>
          <div class="route-actions">
            <button class="btn ghost compact" id="routeUndoBtn" type="button">Undo</button>
            <button class="btn ghost compact" id="routeDoneBtn" type="button">Done</button>
            <button class="btn ghost compact" id="routeStartOverBtn" type="button">Start over</button>
            <button class="btn ghost compact" id="routeExportBtn" type="button">Export GPX</button>
          </div>
          <p class="route-footnote" id="routeDrawFootnote">Routes are straight-line only and do not snap to roads.</p>
        </div>
        <div class="status" id="status"></div>
      </div>
      <div class="pane-block filter-panel">
        <div class="control">
          <label id="mapElementsLabel"><span id="mapElementsLabelText">Map elements</span> <span class="label-hint" id="mapElementsHint">(Click selected filters to unselect.)</span></label>
          <div class="map-element-list" id="mapElementFilters"></div>
        </div>
        <div class="control">
          <label id="areasLabel">Areas</label>
          <div class="chips" id="areaFilters"></div>
        </div>
        <div class="meta pane-meta"><span id="updatedLabel">Loading</span><br><span id="sourceLabel"></span><br><span id="versionLabel"></span></div>
      </div>
    </div>
  </section>
  <button class="drawer-tab" id="drawerToggle" type="button" aria-expanded="true">
    <span id="drawerToggleText">&lt;</span>
  </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-rotate@0.2.8/dist/leaflet-rotate.js"></script>
<script>
const TARGET_AREAS = ["東京都", "神奈川県", "埼玉県", "千葉県", "栃木県"];
const DATA = {locations:[], areas:TARGET_AREAS, counts:{total:0, byBrand:{}, byArea:{}}};
let MAJOR_STATIONS = [];
let RUNNER_LOCATIONS = [];
const APP_VERSION = "2026.07.28.5";
const DEFAULT_CENTER = {lat:35.685175,lng:139.752800};
const GSI_TILE_URL = "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png";
const GSI_ATTRIBUTION = '<a href="https://maps.gsi.go.jp/development/ichiran.html">地理院タイル</a>';
const LIVE_SITE_URL = "https://elkentaro.github.io/run-planner/";
const SITE_QR_IMAGE_URL = "./assets/run-planner-qr.svg";
const DRAW_ZOOM = 16;
const ROUTE_STORAGE_KEY = "runPlannerDrawnRoute";
const GPX_MIME_TYPE = "application/gpx+xml";
const BATHROOM_STORAGE_KEY = "runPlannerBathrooms";
const BATHROOM_DATA_URL = "./data/public-toilets.json";
const BATHROOM_EMOJI = "🚾";
const BATHROOM_MIN_ZOOM = 15;
const BATHROOM_MARKER_LIMIT = 500;
const BATHROOM_ATTRIBUTION = 'Bathroom data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>';
const RAIN_RADAR_STORAGE_KEY = "runPlannerRainRadar";
const RAIN_RADAR_API_URL = "https://api.rainviewer.com/public/weather-maps.json";
const RAIN_RADAR_REFRESH_MS = 5 * 60 * 1000;
const RAIN_RADAR_ATTRIBUTION = 'Weather radar by <a href="https://www.rainviewer.com/">RainViewer</a>';
const CYCLE_PORT_DATA_URL = "./data/docomo-cycle-ports.json";
const CYCLE_PORT_SOURCE_URL = "https://www.google.com/maps/d/viewer?mid=1L2l1EnQJhCNlm_Xxkp9RTjIj68Q";
const CYCLE_PORT_STORAGE_KEY = "runPlannerDocomoCyclePorts";
const CYCLE_PORT_EMOJI = "🚲";
const CYCLE_PORT_MIN_ZOOM = 15;
const CYCLE_PORT_MARKER_LIMIT = 500;
const CYCLE_PORT_ATTRIBUTION = `Cycle-port source: <a href="${CYCLE_PORT_SOURCE_URL}">Tokyo Bike Share Station Map</a>`;
const BRAND_META = {
  "Anytime Fitness": {id:"anytime-fitness", url:"./data/anytime-fitness.json", minimum:500, short:"AF", className:"brand-af", labels:{en:"Anytime Fitness", ja:"エニタイムフィットネス"}},
  "WithGreen": {id:"withgreen", url:"./data/withgreen.json", minimum:25, short:"WG", className:"brand-wg", labels:{en:"WithGreen", ja:"ウィズグリーン"}},
  "CRISP": {id:"crisp", url:"./data/crisp.json", minimum:40, short:"CR", className:"brand-cr", labels:{en:"CRISP SALAD WORKS", ja:"クリスプ・サラダワークス"}},
  "Starbucks": {id:"starbucks", url:"./data/starbucks.json", minimum:650, short:"SB", className:"brand-sb", labels:{en:"Starbucks", ja:"スターバックス"}}
};
const CONVENIENCE_MIN_ZOOM = 14;

function t(key, ...args){
  const value = I18N[state.lang][key] ?? I18N.en[key] ?? key;
  return typeof value === "function" ? value(...args) : value;
}

function setStatusKey(key, ...args){
  state.lastStatusKey = key;
  state.lastStatusArgs = args;
  statusEl.textContent = t(key, ...args);
}

function setStatusText(text){
  state.lastStatusKey = "";
  state.lastStatusArgs = [];
  statusEl.textContent = text || "";
}

function formatDate(value){
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return t("staticData");
  const locale = state.lang === "ja" ? "ja-JP" : undefined;
  return `${t("updated")} ${date.toLocaleString(locale, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"})}`;
}

function fetchJson(url){
  const separator = url.includes("?") ? "&" : "?";
  const versionedUrl = `${url}${separator}v=${encodeURIComponent(APP_VERSION)}`;
  return fetch(versionedUrl, {cache:"no-store"}).then(response=>{
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    return response.json();
  });
}

function validLocationItem(item){
  if(!item || !item.id) return false;
  const lat = Number(item.lat);
  const lng = Number(item.lng);
  return Number.isFinite(lat) && Number.isFinite(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
}

function sourceState(meta){
  return sourceStates.get(meta.id) || {status:"loading", data:null};
}

function rebuildPrimaryData(){
  const locations = [];
  const byBrand = {};
  const byArea = Object.fromEntries(TARGET_AREAS.map(area=>[area, 0]));
  const generatedDates = [];
  for(const [brand, meta] of Object.entries(BRAND_META)){
    const loaded = sourceState(meta);
    const items = loaded.data && Array.isArray(loaded.data.locations) ? loaded.data.locations : [];
    locations.push(...items);
    byBrand[brand] = items.length;
    for(const item of items){
      if(item.area in byArea) byArea[item.area] += 1;
    }
    if(loaded.data && loaded.data.generatedAt) generatedDates.push(loaded.data.generatedAt);
  }
  DATA.locations = locations;
  DATA.generatedAt = generatedDates.sort().at(-1) || "";
  DATA.counts = {total:locations.length, byBrand, byArea};
}

function loadStoreSource(brand, meta, {convenience=false}={}){
  const existing = sourceStates.get(meta.id);
  if(existing && existing.promise) return existing.promise;
  if(existing && existing.status === "ready") return Promise.resolve(existing.data);
  if(existing && existing.status === "error") return Promise.resolve(null);
  const record = existing || {status:"loading", data:null, promise:null};
  record.status = "loading";
  record.promise = fetchJson(meta.url)
    .then(data=>{
      if(!data || !Array.isArray(data.locations)) throw new Error("invalid locations dataset");
      const locations = data.locations.filter(validLocationItem);
      const total = Number(data.counts && data.counts.total);
      if(
        locations.length !== data.locations.length ||
        locations.length < meta.minimum ||
        total !== locations.length ||
        locations.some(item=>item.brand !== brand || !TARGET_AREAS.includes(item.area))
      ){
        throw new Error("incomplete or invalid locations dataset");
      }
      record.data = {...data, locations};
      record.status = "ready";
      if(convenience){
        rebuildConvenienceData();
        renderConvenienceStores(false);
      }else{
        rebuildPrimaryData();
        renderMarkers(false);
      }
      renderFilters();
      updateDataSummary();
      return record.data;
    })
    .catch(error=>{
      record.status = "error";
      record.error = error;
      if(convenience) state.convenienceBrands.delete(brand);
      else state.brands.delete(brand);
      renderFilters();
      return null;
    })
    .finally(()=>{ record.promise = null; });
  sourceStates.set(meta.id, record);
  renderFilters();
  return record.promise;
}

function rebuildConvenienceData(){
  const stores = [];
  const byBrand = {};
  const byArea = Object.fromEntries(TARGET_AREAS.map(area=>[area, 0]));
  const generatedDates = [];
  for(const [brand, meta] of Object.entries(CONVENIENCE_META)){
    const loaded = sourceState(meta);
    const items = loaded.data && Array.isArray(loaded.data.locations) ? loaded.data.locations : [];
    stores.push(...items);
    byBrand[brand] = items.length;
    for(const item of items){
      if(item.area in byArea) byArea[item.area] += 1;
    }
    if(loaded.data && loaded.data.generatedAt) generatedDates.push(loaded.data.generatedAt);
  }
  convenienceData = {
    generatedAt:generatedDates.sort().at(-1) || "",
    counts:{total:stores.length, byBrand, byArea},
    stores
  };
}

function loadMajorStations(){
  majorStationStatus = "loading";
  return fetchJson(MAJOR_STATION_DATA_URL)
    .then(data=>{
      const stations = Array.isArray(data.stations) ? data.stations.filter(validLocationItem) : [];
      if(
        !Array.isArray(data.stations) ||
        stations.length !== data.stations.length ||
        stations.length < 90 ||
        Number(data.counts && data.counts.total) !== stations.length
      ){
        throw new Error("incomplete or invalid station dataset");
      }
      MAJOR_STATIONS = stations;
      majorStationStatus = "ready";
      renderMajorStations();
      renderFilters();
    })
    .catch(()=>{
      MAJOR_STATIONS = [];
      majorStationStatus = "error";
      state.showMajorStations = false;
      renderFilters();
    });
}

function loadRunnerShops(){
  return fetchJson(RUNNER_SHOP_DATA_URL)
    .then(data=>{
      RUNNER_LOCATIONS = Array.isArray(data.locations)
        ? data.locations.filter(validLocationItem).map(item=>({
            ...item,
            mapUrl:item.directionsUrl,
            homepageUrl:item.url
          }))
        : [];
      if(RUNNER_LOCATIONS.length < 1) throw new Error("empty running-shop dataset");
      renderMarkers(false);
    })
    .catch(()=>{ RUNNER_LOCATIONS = []; });
}

function loadInitialLocationData(){
  for(const [brand, meta] of Object.entries(BRAND_META)){
    loadStoreSource(brand, meta);
  }
  loadMajorStations();
  loadRunnerShops();
}

function formatKm(value){
  const number = Number(value) || 0;
  return `${number.toFixed(number % 1 ? 1 : 0)} km`;
}

function escapeHtml(value){
  return String(value).replace(/[<>&'"]/g, character=>({
    "<":"&lt;",
    ">":"&gt;",
    "&":"&amp;",
    "'":"&#39;",
    '"':"&quot;"
  }[character]));
}

function parsePaceMinutes(value){
  const match = String(value || "").trim().match(/^(\d{1,2})(?::(\d{2}))?$/);
  if(!match) return null;
  const minutes = Number(match[1]);
  const seconds = Number(match[2] || 0);
  if(!Number.isFinite(minutes) || !Number.isFinite(seconds) || seconds >= 60) return null;
  return minutes + seconds / 60;
}

function timeLabel(minutes){
  if(!Number.isFinite(minutes) || minutes <= 0) return "-";
  const rounded = Math.round(minutes);
  const hours = Math.floor(rounded / 60);
  const mins = rounded % 60;
  if(state.lang === "ja"){
    return hours ? `${hours}時間 ${mins}分` : `${mins}分`;
  }
  return hours ? `${hours}h ${mins}m` : `${mins} min`;
}

function routeIsVisible(){
  return state.routeMode === "drawing" || state.routePoints.length > 0;
}

function routeCanExport(){
  return state.routeMode === "locked" && state.routePoints.length >= 2;
}

function mapRotationSupported(){
  return Boolean(map && typeof map.setBearing === "function" && typeof map.getBearing === "function");
}

function normalizedBearing(){
  if(!mapRotationSupported()) return 0;
  const bearing = map.getBearing();
  return ((bearing % 360) + 360) % 360;
}

function updateBearingResetControl(){
  if(!bearingResetButton) return;
  const bearing = normalizedBearing();
  const active = Math.abs(bearing) > 0.5 && Math.abs(bearing - 360) > 0.5;
  bearingResetButton.classList.toggle("active", active);
  bearingResetButton.title = t("resetBearing");
  bearingResetButton.setAttribute("aria-label", t("resetBearing"));
  const arrow = bearingResetButton.querySelector(".bearing-reset-icon");
  if(arrow) arrow.style.transform = `rotate(${-bearing}deg)`;
}

function resetMapBearing(){
  if(!mapRotationSupported()) return;
  map.setBearing(0);
  updateBearingResetControl();
}

function addBearingResetControl(){
  if(!mapRotationSupported() || bearingResetControl) return;
  const BearingResetControl = L.Control.extend({
    options:{position:"topright"},
    onAdd(){
      const button = L.DomUtil.create("button", "leaflet-bar bearing-reset-control");
      button.type = "button";
      button.innerHTML = '<span class="bearing-reset-icon" aria-hidden="true"><span class="bearing-reset-arrow">↑</span><span class="bearing-reset-letter">N</span></span>';
      L.DomEvent.disableClickPropagation(button);
      L.DomEvent.on(button, "click", event=>{
        L.DomEvent.stop(event);
        resetMapBearing();
      });
      bearingResetButton = button;
      updateBearingResetControl();
      return button;
    }
  });
  bearingResetControl = new BearingResetControl();
  bearingResetControl.addTo(map);
  map.on("rotate", updateBearingResetControl);
}

function renderRouteVisual(){
  routeVisualFrame = null;
  if(!routeVisualPath) return;
  if(!routeIsVisible() || state.routePoints.length < 2){
    routeVisualPath.setAttribute("d", "");
    return;
  }
  const pathData = state.routePoints.map((point, index)=>{
    const screenPoint = map.latLngToContainerPoint(latLngFromPoint(point));
    return `${index ? "L" : "M"}${screenPoint.x.toFixed(2)} ${screenPoint.y.toFixed(2)}`;
  }).join(" ");
  routeVisualPath.setAttribute("d", pathData);
}

function scheduleRouteVisualRender(){
  if(routeVisualFrame != null) return;
  routeVisualFrame = window.requestAnimationFrame(renderRouteVisual);
}

function addRouteVisualOverlay(){
  if(routeVisualOverlay) return;
  routeVisualOverlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  routeVisualOverlay.classList.add("route-visual-overlay");
  routeVisualOverlay.setAttribute("aria-hidden", "true");
  routeVisualPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
  routeVisualPath.classList.add("route-visual-line");
  routeVisualOverlay.appendChild(routeVisualPath);
  map.getContainer().appendChild(routeVisualOverlay);
  map.on("rotate move zoom viewreset resize", scheduleRouteVisualRender);
}

function pointFromLatLng(latlng){
  return {lat:Number(latlng.lat), lng:Number(latlng.lng)};
}

function latLngFromPoint(point){
  return L.latLng(point.lat, point.lng);
}

function sameRoutePoint(left, right){
  return Boolean(left && right && Math.abs(Number(left.lat) - Number(right.lat)) < 0.0000001 && Math.abs(Number(left.lng) - Number(right.lng)) < 0.0000001);
}

function routeDistanceKm(){
  let meters = 0;
  for(let index = 1; index < state.routePoints.length; index += 1){
    meters += latLngFromPoint(state.routePoints[index - 1]).distanceTo(latLngFromPoint(state.routePoints[index]));
  }
  return meters / 1000;
}

function routeDistanceLabel(value){
  const number = Number(value) || 0;
  if(number < 10) return `${number.toFixed(2)} km`;
  return `${number.toFixed(1)} km`;
}

function validCoord(lat, lng){
  return Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180;
}

function coordsFromPair(text){
  const match = String(text || "").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
  if(!match) return null;
  const lat = Number(match[1]);
  const lng = Number(match[2]);
  return validCoord(lat, lng) ? {lat, lng} : null;
}

function parseCoordinates(value){
  const text = String(value || "").trim();
  if(!text) throw new Error(t("coordsRequired"));
  const parsed = coordsFromPair(text);
  if(parsed) return parsed;
  throw new Error(t("coordsFormat"));
}

function setLayerVisible(layer, visible){

function syncRouteVisibility(){

function updateDistanceMetrics(){

  loopStatLabelEl.textContent = t("loopStat");
  timeMetric.textContent = pace ? timeLabel(state.radiusKm * pace) : "-";

function updateRoute(fit=false){

  centerMarker.setLatLng(center);
  routeCircle.setLatLng(center);
  routeCircle.setRadius(radiusMeters);
  syncRouteVisibility();
  updateDistanceMetrics();

function normalizeRoutePoints(points){
  if(!Array.isArray(points)) return [];
  return points.map(point=>{
    const lat = Number(point && point.lat);
    const lng = Number(point && (point.lng ?? point.lon));
    return validCoord(lat, lng) ? {lat, lng} : null;
  }).filter(Boolean);
}

function loadSavedRoute(){
  try{
    const raw = localStorage.getItem(ROUTE_STORAGE_KEY);
    if(!raw) return false;
    const parsed = JSON.parse(raw);
    const points = normalizeRoutePoints(parsed.points || parsed);
    if(points.length < 2){
      localStorage.removeItem(ROUTE_STORAGE_KEY);
      return false;
    }
    state.routePoints = points;
    state.routeMode = "locked";
    return true;
  }catch(error){
    localStorage.removeItem(ROUTE_STORAGE_KEY);
    return false;
  }
}

function routePointIcon(index, total){
  const role = index === 0 ? "start" : index === total - 1 && total > 1 ? "end" : "mid";

    iconAnchor:[9,9]
  });
}

function pointToSegmentDistanceSquared(point, start, end){
  const dx = end.x - start.x;
  const dy = end.y - start.y;
  if(dx === 0 && dy === 0){
    const singleDx = point.x - start.x;
    const singleDy = point.y - start.y;
    return singleDx * singleDx + singleDy * singleDy;
  }
  const ratio = Math.max(0, Math.min(1, ((point.x - start.x) * dx + (point.y - start.y) * dy) / (dx * dx + dy * dy)));
  const projectedX = start.x + ratio * dx;
  const projectedY = start.y + ratio * dy;
  const projectedDx = point.x - projectedX;
  const projectedDy = point.y - projectedY;
  return projectedDx * projectedDx + projectedDy * projectedDy;
}

function routeInsertionIndex(latlng){
  if(state.routePoints.length < 2) return state.routePoints.length;
  const clickPoint = map.latLngToLayerPoint(latlng);
  let bestIndex = 1;
  let bestDistance = Infinity;
  for(let index = 1; index < state.routePoints.length; index += 1){
    const start = map.latLngToLayerPoint(latLngFromPoint(state.routePoints[index - 1]));
    const end = map.latLngToLayerPoint(latLngFromPoint(state.routePoints[index]));
    const distance = pointToSegmentDistanceSquared(clickPoint, start, end);
    if(distance < bestDistance){
      bestDistance = distance;
      bestIndex = index;
    }
  }
  return bestIndex;
}

function updateDraggedRoutePoint(index, latlng){
  if(!state.routePoints[index]) return;
  state.routePoints[index] = pointFromLatLng(latlng);
  drawnRouteLine.setLatLngs(state.routePoints.map(latLngFromPoint));
  scheduleRouteVisualRender();
  updateDistanceMetrics();
}

function renderDrawnRoute(){
  if(!drawnRouteLine || !routePointLayer) return;
  const latLngs = state.routePoints.map(latLngFromPoint);
  drawnRouteLine.setLatLngs(latLngs);
  drawnRouteLine.off("click");
  drawnRouteLine.off("contextmenu");
  if(state.routePoints.length > 0){
    drawnRouteLine.on("click", event=>{
      if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
      insertRouteControlPoint(event.latlng);
    });
    drawnRouteLine.on("contextmenu", event=>{
      if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
      showRouteMenu(event.latlng);
    });
  }
  routePointLayer.clearLayers();
  const drawing = state.routeMode === "drawing";
  state.routePoints.forEach((point, index)=>{
    const marker = L.marker([point.lat, point.lng], {
      icon:routePointIcon(index, state.routePoints.length),
      draggable:drawing,
      bubblingMouseEvents:false
    });
    marker.on("click", event=>{
      if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
      if(!drawing) showDistancePopup(event.latlng);
    });
    marker.on("contextmenu", event=>{
      if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
      showRouteMenu(event.latlng);
    });
    marker.on("dragstart", ()=>{
      if(routeDistancePopupTimer) window.clearTimeout(routeDistancePopupTimer);
      map.closePopup();
    });
    marker.on("drag", event=>{
      updateDraggedRoutePoint(index, event.target.getLatLng());
    });
    marker.on("dragend", event=>{
      updateDraggedRoutePoint(index, event.target.getLatLng());
      renderDrawnRoute();
      setStatusKey("routeControlPointMoved");
    });
    marker.addTo(routePointLayer);
  });
  syncRouteVisibility();
  scheduleRouteVisualRender();
  updateDistanceMetrics();
  renderRouteControls();
}

function popupButton(label, className, disabled, onClick){

  button.addEventListener("click", event=>{
    event.preventDefault();
    L.DomEvent.stop(event);
    if(button.disabled) return;
    map.closePopup();
    onClick();
  });
  return button;
}

function lockDrawZoom(focusLatLng){
  if(!map) return;
  if(!state.drawZoomRestore){
    state.drawZoomRestore = {min:map.getMinZoom(), max:map.getMaxZoom()};
  }
  const focus = focusLatLng ? L.latLng(focusLatLng) : state.routePoints.length ? latLngFromPoint(state.routePoints[state.routePoints.length - 1]) : map.getCenter();
  map.setView(focus, DRAW_ZOOM);
  map.setMinZoom(DRAW_ZOOM);
  map.setMaxZoom(DRAW_ZOOM);
}

function unlockDrawZoom(){
  if(!map || !state.drawZoomRestore) return;
  map.setMinZoom(state.drawZoomRestore.min);
  map.setMaxZoom(state.drawZoomRestore.max);
  state.drawZoomRestore = null;
}

function defaultRouteStartLatLng(){
  return L.latLng(state.lat, state.lng);
}

function beginRouteDraw(focusLatLng){
  state.routeMode = "drawing";
  if(!state.routePoints.length){
    setRouteStart(defaultRouteStartLatLng(), false);
    return;
  }
  if(state.routePoints.length){
    lockDrawZoom(focusLatLng);
  }
  renderDrawnRoute();
  setStatusKey(state.routePoints.length ? "routeAddPrompt" : "routeStartPrompt");
}

function stopRouteDraw(){
  unlockDrawZoom();
  map.closePopup();
  let statusKey = "routeDrawOff";
  if(state.routePoints.length < 2){
    state.routePoints = [];
    state.routeMode = "empty";
    clearSavedRoute();
  }else{
    state.routeMode = "locked";
    saveDrawnRoute();
    statusKey = "routeDone";
  }
  renderDrawnRoute();
  setStatusKey(statusKey);
}

function toggleRouteDraw(){
  if(state.routeMode === "drawing"){
    stopRouteDraw();
    return;
  }
  beginRouteDraw();
}

function setRouteStart(latlng, showPopup=true){
  state.routePoints = [pointFromLatLng(latlng)];
  state.routeMode = "drawing";
  lockDrawZoom(latlng);
  renderDrawnRoute();
  setStatusKey(showPopup ? "routeStartSet" : "routeAddPrompt");
  if(showPopup) showDistancePopup(latLngFromPoint(state.routePoints[0]));
}

function addRouteWaypoint(latlng, options={}){
  const point = pointFromLatLng(latlng);
  const lastPoint = state.routePoints[state.routePoints.length - 1];
  if(!sameRoutePoint(lastPoint, point)){
    state.routePoints.push(point);
  }
  renderDrawnRoute();
  setStatusKey(options.statusKey || "routeWaypointAdded");
  if(options.showDistance !== false) showDistancePopup(latlng);
}

function addLocationWaypoint(location){
  if(state.routeMode !== "drawing") return false;
  const latlng = L.latLng(location.lat, location.lng);
  if(!state.routePoints.length){
    setRouteStart(defaultRouteStartLatLng(), false);
  }
  addRouteWaypoint(latlng, {statusKey:"routeLocationWaypointAdded", showDistance:false});
  showRouteLocationGoalPopup(location, latlng);
  return true;
}

function insertRouteControlPoint(latlng){
  if(state.routePoints.length < 2) return;
  if(routeDistancePopupTimer) window.clearTimeout(routeDistancePopupTimer);
  map.closePopup();
  if(state.routeMode !== "drawing"){
    state.routeMode = "drawing";
    lockDrawZoom(latlng);
  }
  const insertAt = routeInsertionIndex(latlng);
  state.routePoints.splice(insertAt, 0, pointFromLatLng(latlng));
  renderDrawnRoute();
  setStatusKey("routeControlPointAdded");
}

function undoRoutePoint(){
  if(state.routeMode !== "drawing" || state.routePoints.length <= 1) return;
  state.routePoints.pop();
  renderDrawnRoute();
  setStatusKey("routeUndoDone");
  showDistancePopup(latLngFromPoint(state.routePoints[state.routePoints.length - 1]));
}

function startOverRoute(){
  clearSavedRoute();
  state.routePoints = [];
  state.routeMode = "drawing";
  unlockDrawZoom();
  map.closePopup();
  setRouteStart(defaultRouteStartLatLng(), false);
}

function completeRoute(statusKey="routeDone"){
  if(state.routePoints.length < 2){
    setStatusKey("routeNeedWaypoint");
    return;
  }
  state.routeMode = "locked";
  unlockDrawZoom();
  map.closePopup();
  saveDrawnRoute();
  renderDrawnRoute();
  setStatusKey(statusKey);
}

function handleRouteMapClick(event){
  if(state.routeMode !== "drawing") return false;
  if(state.routePoints.length === 0){
    showStartPointPopup(event.latlng);
    return true;
  }
  addRouteWaypoint(event.latlng);
  return true;
}

function escapeXml(value){
  return String(value).replace(/[<>&'"]/g, character=>({
    "<":"&lt;",
    ">":"&gt;",
    "&":"&amp;",
    "'":"&apos;",
    '"':"&quot;"
  }[character]));
}

function exportGpx(){
  if(!routeCanExport()){
    setStatusKey("gpxUnavailable");
    return;
  }
  const now = new Date();
  const name = "Run Planner Route";
  const distance = routeDistanceLabel(routeDistanceKm());
  const escapedName = escapeXml(name);
  const escapedDistance = escapeXml(distance);
  const routePoints = state.routePoints.map((point, index)=>{
    const waypointName = index === 0 ? "Start" : index === state.routePoints.length - 1 ? "Finish" : `Waypoint ${index}`;
    return `    <rtept lat="${point.lat.toFixed(8)}" lon="${point.lng.toFixed(8)}">
      <name>${escapeXml(waypointName)}</name>
    </rtept>`;
  }).join("\n");
  const trackPoints = state.routePoints.map(point=>`      <trkpt lat="${point.lat.toFixed(8)}" lon="${point.lng.toFixed(8)}" />`).join("\n");
  const gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="Run Planner" xmlns="http://www.topografix.com/GPX/1/1" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">
  <metadata>
    <name>${escapedName}</name>
    <desc>${escapedDistance}</desc>
    <time>${now.toISOString()}</time>
  </metadata>
  <rte>
    <name>${escapedName}</name>
    <desc>${escapedDistance}</desc>
${routePoints}
  </rte>
  <trk>
    <name>${escapedName}</name>
    <desc>${escapedDistance}</desc>
    <type>running</type>
    <trkseg>
${trackPoints}
    </trkseg>
  </trk>
</gpx>
`;
  const filename = `run-planner-route-${now.toISOString().slice(0, 10)}.gpx`;
  const file = typeof File === "function"
    ? new File([gpx], filename, {type:GPX_MIME_TYPE, lastModified:now.getTime()})
    : new Blob([gpx], {type:GPX_MIME_TYPE});
  const url = URL.createObjectURL(file);
  const link = document.createElement("a");
  link.href = url;
  link.download = filename;
  link.type = GPX_MIME_TYPE;
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  setStatusKey("gpxExported");
}

    ["female", "female"]
  ];
  const lines = [];
  for(const [tag, labelKey] of fields){
    if(tags[tag]) lines.push(`${t(labelKey)}: ${bathroomTagValue(tags[tag])}`);
  }
  return lines;
}

function bathroomLocation(item){
  const tags = item.tags || {};
  const query = `${item.lat.toFixed(7)},${item.lng.toFixed(7)}`;
  const details = bathroomDetailLines(tags);
  return {
    id:item.id,
    name:bathroomDisplayName(tags),
    lat:item.lat,
    lng:item.lng,
    hours:tags.opening_hours ? `${t("openingHours")}: ${tags.opening_hours}` : "",
    note:details.join("; "),
    mapUrl:`https://www.google.com/maps/search/?api=1&query=${query}`,
    url:`https://www.openstreetmap.org/${item.osmType}/${item.osmId}`
  };
}

function ensureBathroomsLoaded(){
  if(bathroomData) return Promise.resolve(bathroomData);
  if(!bathroomLoadPromise){
    state.bathroomStatus = "loading";
    bathroomLoadPromise = fetchJson(BATHROOM_DATA_URL)
      .then(data=>{
        const toilets = Array.isArray(data.toilets) ? data.toilets.filter(validLocationItem) : [];
        if(!toilets.length) throw new Error("empty public-toilet dataset");
        bathroomData = {...data, toilets};
        state.bathroomStatus = "ready";
        return bathroomData;
      })
      .catch(error=>{
        state.bathroomStatus = "error";
        throw error;
      })
      .finally(()=>{ bathroomLoadPromise = null; });
  }
  return bathroomLoadPromise;
}

function visibleBathrooms(){
  if(!state.showBathrooms || !bathroomData || !map || map.getZoom() < BATHROOM_MIN_ZOOM) return [];
  const bounds = map.getBounds().pad(0.03);
  return bathroomData.toilets
    .filter(item=>bounds.contains([item.lat, item.lng]))
    .slice(0, BATHROOM_MARKER_LIMIT);
}

function renderBathrooms(updateFilters=true){
  if(!bathroomLayer || !map) return;
  bathroomLayer.clearLayers();
  state.bathroomCount = 0;
  if(!state.showBathrooms){
    if(state.bathroomStatus !== "error") state.bathroomStatus = bathroomData ? "ready" : "idle";
    if(updateFilters) renderFilters();
    return;
  }
  if(map.getZoom() < BATHROOM_MIN_ZOOM){
    state.bathroomStatus = bathroomData ? "ready" : "idle";
    if(updateFilters) renderFilters();
    return;
  }
  if(!bathroomData){
    ensureBathroomsLoaded()
      .then(()=>renderBathrooms(updateFilters))
      .catch(()=>{
        state.showBathrooms = false;
        localStorage.setItem(BATHROOM_STORAGE_KEY, "0");
        if(updateFilters) renderFilters();
        setStatusKey("bathroomLoadFailed");
      });
    if(updateFilters) renderFilters();
    return;
  }
  const items = visibleBathrooms();
  state.bathroomCount = items.length;
  state.bathroomStatus = "ready";
  for(const item of items){
    const location = bathroomLocation(item);
    const marker = L.marker([location.lat, location.lng], {
      icon:bathroomIcon(),
      title:location.name,
      zIndexOffset:-450
    });
    marker.on("click", event=>{
      if(addLocationWaypoint(location)){
        if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
        return;
      }
      marker.bindPopup(popupElement(location)).openPopup();
    });
    marker.addTo(bathroomLayer);
  }
  if(updateFilters) renderFilters();
}

function ensureCyclePortsLoaded(){
  if(cyclePortData) return Promise.resolve(cyclePortData);
  if(!cyclePortLoadPromise){
    cyclePortLoadPromise = fetchJson(CYCLE_PORT_DATA_URL)
      .then(data=>{
        const ports = Array.isArray(data.ports)
          ? data.ports.filter(port=>port && validCoord(Number(port.lat), Number(port.lng)))
          : [];
        if(
          !Array.isArray(data.ports) ||
          ports.length !== data.ports.length ||
          ports.length < 1500 ||
          Number(data.counts && data.counts.total) !== ports.length
        ){
          throw new Error("incomplete or invalid cycle-port dataset");
        }
        cyclePortData = {
          generatedAt:data.generatedAt || "",
          source:data.source || CYCLE_PORT_SOURCE_URL,
          counts:data.counts || {total:ports.length},
          ports
        };
        cyclePortLoadPromise = null;
        return cyclePortData;
      })
      .catch(error=>{
        cyclePortLoadPromise = null;
        throw error;
      });
  }
  return cyclePortLoadPromise;
}

function cyclePortLocation(item){
  const lat = Number(item.lat);
  const lng = Number(item.lng);
  return {
    id:item.id,
    name:item.name || t("cyclePort"),
    lat,
    lng,
    mapUrl:`https://www.google.com/maps/search/?api=1&query=${lat.toFixed(7)},${lng.toFixed(7)}`
  };
}

function visibleCyclePorts(){
  if(!state.showCyclePorts || !cyclePortData || !map || map.getZoom() < CYCLE_PORT_MIN_ZOOM) return [];
  const bounds = map.getBounds().pad(0.08);
  return cyclePortData.ports
    .filter(port=>bounds.contains([port.lat, port.lng]))
    .slice(0, CYCLE_PORT_MARKER_LIMIT);
}

function renderCyclePorts(updateFilters=true){
  if(!cyclePortLayer || !map) return;
  cyclePortLayer.clearLayers();
  if(!state.showCyclePorts){
    state.cyclePortCount = 0;
    if(state.cyclePortStatus !== "error") state.cyclePortStatus = cyclePortData ? "ready" : "idle";
    if(updateFilters) renderFilters();
    return;
  }
  if(map.getZoom() < CYCLE_PORT_MIN_ZOOM){
    state.cyclePortCount = 0;
    state.cyclePortStatus = "zoom";
    if(updateFilters) renderFilters();
    if(updateFilters) setStatusKey("cyclePortZoomStatus", CYCLE_PORT_MIN_ZOOM);
    return;
  }
  if(!cyclePortData){
    if(state.cyclePortStatus === "error"){
      if(updateFilters) renderFilters();
      return;
    }
    state.cyclePortStatus = "loading";
    if(updateFilters) renderFilters();
    setStatusKey("cyclePortLoadingStatus");
    ensureCyclePortsLoaded()
      .then(()=>{
        state.cyclePortStatus = "ready";
        renderCyclePorts(updateFilters);
      })
      .catch(()=>{
        state.cyclePortStatus = "error";
        state.cyclePortCount = 0;
        state.showCyclePorts = false;
        localStorage.setItem(CYCLE_PORT_STORAGE_KEY, "0");
        if(updateFilters) renderFilters();
        setStatusKey("cyclePortLoadFailedStatus");
      });
    return;
  }
  const ports = visibleCyclePorts();
  state.cyclePortCount = ports.length;
  state.cyclePortStatus = "ready";
  for(const item of ports){
    const location = cyclePortLocation(item);
    const marker = L.marker([location.lat, location.lng], {
      icon:cyclePortIcon(),
      title:location.name,
      zIndexOffset:-400
    });
    marker.on("click", event=>{
      if(addLocationWaypoint(location)){
        if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
        return;
      }
      marker.bindPopup(popupElement(location)).openPopup();
    });
    marker.addTo(cyclePortLayer);
  }
  if(updateFilters) renderFilters();
  setStatusKey("cyclePortVisibleStatus", ports.length, cyclePortData.ports.length);
}

function stationDisplayName(station){
  if(state.lang === "ja") return station.nameJa || station.name;
  return station.nameEn || station.name;
}

function majorStationIcon(station){
  return L.divIcon({
    className:"major-station-icon",
    html:`<span class="major-station-label">${escapeHtml(stationDisplayName(station))}</span>`,
    iconSize:[1,1],
    iconAnchor:[0,13]
  });
}

function visibleLocations(){
  return (DATA.locations || []).filter(location=>{
    if(!state.brands.has(location.brand)) return false;
    if(!state.areas.has(location.area)) return false;
    return true;
  });
}

function convenienceFilterBrands(){
  return Object.keys(CONVENIENCE_META);
}

function ensureConvenienceStoresLoaded(){
  const loads = Array.from(state.convenienceBrands, brand=>{
    const meta = CONVENIENCE_META[brand];
    return meta ? loadStoreSource(brand, meta, {convenience:true}) : Promise.resolve(null);
  });
  return Promise.all(loads).then(()=>convenienceData);
}

function convenienceCandidates(){
  if(!convenienceData) return [];
  return (convenienceData.stores || []).filter(location=>{
    if(!state.convenienceBrands.has(location.brand)) return false;
    if(!state.areas.has(location.area)) return false;
    return true;
  });
}

function renderConvenienceStores(updateStatus=false){
  if(!convenienceLayer) return;
  convenienceLayer.clearLayers();
  if(!state.convenienceBrands.size){
    if(updateStatus) setStatusKey("visibleStatus", visibleLocations().length, (DATA.locations || []).length);
    return;
  }
  const missing = Array.from(state.convenienceBrands).some(brand=>sourceState(CONVENIENCE_META[brand]).status !== "ready");
  if(missing){
    setStatusKey("convenienceLoading");
    ensureConvenienceStoresLoaded()
      .then(()=>{
        renderFilters();
        renderConvenienceStores(updateStatus);
      })
      .catch(()=>setStatusKey("convenienceLoadFailed"));
    return;
  }
  const candidates = convenienceCandidates();
  if(!map || map.getZoom() < CONVENIENCE_MIN_ZOOM){
    if(updateStatus) setStatusKey("convenienceZoomPrompt", CONVENIENCE_MIN_ZOOM);
    return;
  }
  const bounds = map.getBounds().pad(0.12);
  const visible = candidates
    .filter(location=>bounds.contains([location.lat, location.lng]))
    .slice(0, CONVENIENCE_MARKER_LIMIT);
  for(const location of visible){
    const marker = L.marker([location.lat, location.lng], {
      icon:convenienceIcon(location),
      title:location.name,
      zIndexOffset:-350
    });
    marker.on("click", event=>{
      if(addLocationWaypoint(location)){
        if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
        return;
      }
      marker.bindPopup(popupElement(location)).openPopup();
    });
    marker.addTo(convenienceLayer);
  }
  if(updateStatus) setStatusKey("convenienceVisibleStatus", visible.length, candidates.length);
}

function majorStationZoomLimit(){
  const zoom = map ? map.getZoom() : 10;
  if(zoom >= 14) return MAJOR_STATIONS.length;
  if(zoom >= 12) return 70;
  if(zoom >= 11) return 36;
  return 18;
}

function visibleMajorStations(){
  if(!state.showMajorStations || !map) return [];
  const bounds = map.getBounds().pad(0.2);
  const limit = majorStationZoomLimit();
  return MAJOR_STATIONS.filter(station=>bounds.contains([station.lat, station.lng])).slice(0, limit);
}

function renderMajorStations(){
  if(!majorStationLayer) return;
  majorStationLayer.clearLayers();
  for(const station of visibleMajorStations()){
    L.marker([station.lat, station.lng], {
      icon:majorStationIcon(station),
      interactive:false,
      keyboard:false,
      pane:"majorStationPane",
      zIndexOffset:1000
    }).addTo(majorStationLayer);
  }
}

function renderMarkers(updateStatus=true){
  const items = visibleLocations();
  markerLayer.clearLayers();
  for(const location of items){
    const marker = L.marker([location.lat, location.lng], {icon:markerIcon(location), title:location.name});
    marker.on("click", event=>{
      if(addLocationWaypoint(location)){
        if(event.originalEvent) L.DomEvent.stop(event.originalEvent);
        return;
      }
      marker.bindPopup(popupElement(location)).openPopup();
    });
    marker.addTo(markerLayer);
  }
  for(const location of RUNNER_LOCATIONS){
    L.marker([location.lat, location.lng], {icon:runnerIcon(), title:location.name})
      .bindPopup(popupElement(location))
      .addTo(markerLayer);
  }
  if(updateStatus) setStatusKey("visibleStatus", items.length, (DATA.locations || []).length);
}

function checkboxChip(label, checked, onChange, dotClass){
  const chip = document.createElement("label");
  chip.className = "chip";
  chip.classList.toggle("active", checked);
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = checked;
  input.addEventListener("change", () => {
    chip.classList.toggle("active", input.checked);
    onChange(input.checked);
  });
  const span = document.createElement("span");
  if(dotClass){
    const dot = document.createElement("i");
    dot.className = `dot ${dotClass}`;
    span.appendChild(dot);
  }
  span.appendChild(document.createTextNode(label));
  chip.append(input, span);
  return chip;
}

function mapElementButton({code="", name, count="", checked, disabled=false, onChange, dotClass}){
  const row = document.createElement("label");
  row.className = "map-element-btn";
  row.classList.toggle("active", checked);
  row.classList.toggle("disabled", disabled);
  row.setAttribute("aria-disabled", String(Boolean(disabled)));
  const input = document.createElement("input");
  input.type = "checkbox";
  input.checked = checked;
  input.disabled = Boolean(disabled);
  input.addEventListener("change", () => {
    if(input.disabled) return;
    row.classList.toggle("active", input.checked);
    onChange(input.checked);
  });
  const dot = document.createElement("i");
  dot.className = `dot ${dotClass || ""}`.trim();
  const codeEl = document.createElement("span");
  codeEl.className = "map-element-code";
  codeEl.textContent = code;
  const nameEl = document.createElement("span");
  nameEl.className = "map-element-name";
  nameEl.textContent = name;
  const countEl = document.createElement("span");
  countEl.className = "map-element-count";
  countEl.textContent = count === "" || count === null || count === undefined ? "" : String(count);
  row.append(input, dot, codeEl, nameEl, countEl);
  return row;
}

function metaLabel(meta, fallback){
  return meta && meta.labels && meta.labels[state.lang] ? meta.labels[state.lang] : fallback;
}

function rainRadarTimeLabel(){
  if(!Number.isFinite(state.rainRadarTime)) return "";
  const locale = state.lang === "ja" ? "ja-JP" : undefined;
  const time = new Date(state.rainRadarTime * 1000).toLocaleTimeString(locale, {
    hour:"2-digit",
    minute:"2-digit"
  });
  return t("rainRadarTime", time);
}

function rainRadarElementCount(){
  if(!state.showRainRadar) return "";
  if(state.rainRadarStatus === "loading") return t("rainRadarLoading");
  if(state.rainRadarStatus === "error") return t("rainRadarLoadFailed");
  return rainRadarTimeLabel();
}

function stopRainRadarRefresh(){
  if(rainRadarRefreshTimer){
    window.clearInterval(rainRadarRefreshTimer);
    rainRadarRefreshTimer = null;
  }
}

function scheduleRainRadarRefresh(){
  stopRainRadarRefresh();
  if(state.showRainRadar){
    rainRadarRefreshTimer = window.setInterval(()=>refreshRainRadar(true), RAIN_RADAR_REFRESH_MS);
  }
}

function setRainRadarLayer(tileUrl){
  if(rainRadarLayer){
    rainRadarLayer.setUrl(tileUrl);
  }else{
    rainRadarLayer = L.tileLayer(tileUrl, {
      pane:"rainRadarPane",
      opacity:.65,
      maxZoom:18,
      maxNativeZoom:8,
      zIndex:10,
      tileSize:512,
      zoomOffset:-1,
      attribution:RAIN_RADAR_ATTRIBUTION
    }).addTo(map);
  }
}

async function refreshRainRadar(silent=false){
  if(!state.showRainRadar || rainRadarLoadPromise) return rainRadarLoadPromise;
  if(!silent || !rainRadarLayer){
    state.rainRadarStatus = "loading";
    renderMapElementFilters();
  }
  rainRadarLoadPromise = fetch(RAIN_RADAR_API_URL, {headers:{Accept:"application/json"}})
    .then(response=>{
      if(!response.ok) throw new Error(`Rain radar HTTP ${response.status}`);
      return response.json();
    })
    .then(payload=>{
      const frames = payload && payload.radar && Array.isArray(payload.radar.past) ? payload.radar.past : [];
      const frame = frames[frames.length - 1];
      const host = String(payload && payload.host || "");
      const path = String(frame && frame.path || "");
      const time = Number(frame && frame.time);
      if(!host.startsWith("https://") || !path.startsWith("/") || !Number.isFinite(time)){
        throw new Error("Invalid rain radar response");
      }
      if(!state.showRainRadar) return;
      setRainRadarLayer(`${host}${path}/512/{z}/{x}/{y}/2/1_1.png`);
      state.rainRadarTime = time;
      state.rainRadarStatus = "ready";
    })
    .catch(()=>{
      if(state.showRainRadar) state.rainRadarStatus = "error";
    })
    .finally(()=>{
      rainRadarLoadPromise = null;
      renderMapElementFilters();
    });
  return rainRadarLoadPromise;
}

function setRainRadarEnabled(enabled){
  state.showRainRadar = Boolean(enabled);
  localStorage.setItem(RAIN_RADAR_STORAGE_KEY, state.showRainRadar ? "1" : "0");
  if(state.showRainRadar){
    refreshRainRadar();
    scheduleRainRadarRefresh();
  }else{
    stopRainRadarRefresh();
    if(rainRadarLayer){
      map.removeLayer(rainRadarLayer);
      rainRadarLayer = null;
    }
    state.rainRadarStatus = "idle";
    state.rainRadarTime = null;
    renderMapElementFilters();
  }
}

function bathroomElementCount(){
  if(!bathroomZoomAvailable()) return t("bathroomZoomPrompt", BATHROOM_MIN_ZOOM);
  if(state.bathroomStatus === "loading") return t("bathroomLoading");
  if(state.bathroomStatus === "error") return t("bathroomLoadFailed");
  if(!state.showBathrooms) return "";
  return state.bathroomCount;
}

function cyclePortElementCount(){
  if(!cyclePortZoomAvailable()) return t("cyclePortZoomPrompt", CYCLE_PORT_MIN_ZOOM);
  if(state.cyclePortStatus === "loading") return t("cyclePortLoading");
  if(state.cyclePortStatus === "error") return t("cyclePortLoadFailed");
  if(!state.showCyclePorts) return "";
  return state.cyclePortCount;
}

function sourceElementCount(status, count, {zoomMinimum=0}={}){
  if(zoomMinimum && (!map || map.getZoom() < zoomMinimum)) return t("convenienceZoomShort", zoomMinimum);
  if(status === "loading") return t("bathroomLoading");
  if(status === "error") return t("bathroomLoadFailed");
  return Number.isFinite(count) && count > 0 ? count : "";
}

function convenienceElementCount(status, count){
  if(!convenienceZoomAvailable()) return t("convenienceZoomShort", CONVENIENCE_MIN_ZOOM);
  return sourceElementCount(status, count);
}

function convenienceZoomAvailable(){
  return Boolean(map && map.getZoom() >= CONVENIENCE_MIN_ZOOM);
}

function bathroomZoomAvailable(){
  return Boolean(map && map.getZoom() >= BATHROOM_MIN_ZOOM);
}

function cyclePortZoomAvailable(){
  return Boolean(map && map.getZoom() >= CYCLE_PORT_MIN_ZOOM);
}

function renderMapElementFilters(){
  const mapElementFilters = document.getElementById("mapElementFilters");
  mapElementFilters.innerHTML = "";
  mapElementFilters.appendChild(mapElementButton({
    code:state.lang === "ja" ? "駅" : "ST",
    name:t("majorStations"),
    count:sourceElementCount(majorStationStatus, MAJOR_STATIONS.length),
    checked:state.showMajorStations,
    disabled:majorStationStatus === "error",
    dotClass:"station-dot",
    onChange:checked=>{
      state.showMajorStations = checked;
      localStorage.setItem("runPlannerMajorStations", checked ? "1" : "0");
      renderMajorStations();
    }
  }));
  for(const [brand, meta] of Object.entries(BRAND_META)){
    const count = DATA.counts && DATA.counts.byBrand ? DATA.counts.byBrand[brand] || 0 : 0;
    const loaded = sourceState(meta);
    mapElementFilters.appendChild(mapElementButton({
      code:meta.short,
      name:metaLabel(meta, brand),
      count:sourceElementCount(loaded.status, count),
      checked:state.brands.has(brand),
      disabled:loaded.status === "error",
      dotClass:meta.className,
      onChange:checked=>{
        checked ? state.brands.add(brand) : state.brands.delete(brand);
        renderMarkers();
      }
    }));
  }
  const convenienceCounts = convenienceData && convenienceData.counts && convenienceData.counts.byBrand ? convenienceData.counts.byBrand : {};
  const convenienceAvailable = convenienceZoomAvailable();
  for(const brand of convenienceFilterBrands()){
    const meta = CONVENIENCE_META[brand];
    const count = Number(convenienceCounts[brand]);
    const loaded = sourceStates.get(meta.id) || {status:"idle"};
    mapElementFilters.appendChild(mapElementButton({
      code:meta.markerText || meta.short,
      name:metaLabel(meta, brand),
      count:convenienceElementCount(loaded.status, count),
      checked:state.convenienceBrands.has(brand) && convenienceAvailable,
      disabled:!convenienceAvailable || loaded.status === "error",
      dotClass:meta.className,
      onChange:checked=>{
        checked ? state.convenienceBrands.add(brand) : state.convenienceBrands.delete(brand);
        renderConvenienceStores(true);
      }
    }));
  }
  const bathroomAvailable = bathroomZoomAvailable();
  mapElementFilters.appendChild(mapElementButton({
    code:BATHROOM_EMOJI,
    name:t("publicBathrooms"),
    count:bathroomElementCount(),
    checked:state.showBathrooms && bathroomAvailable,
    disabled:!bathroomAvailable || state.bathroomStatus === "error",
    dotClass:"bathroom-dot",
    onChange:checked=>{
      state.showBathrooms = checked;
      localStorage.setItem(BATHROOM_STORAGE_KEY, checked ? "1" : "0");
      renderBathrooms();
    }
  }));
  const cyclePortsAvailable = cyclePortZoomAvailable();
  mapElementFilters.appendChild(mapElementButton({
    code:CYCLE_PORT_EMOJI,
    name:t("cyclePorts"),
    count:cyclePortElementCount(),
    checked:state.showCyclePorts && cyclePortsAvailable,
    disabled:!cyclePortsAvailable || state.cyclePortStatus === "error",
    dotClass:"cycle-port-dot",
    onChange:checked=>{
      state.showCyclePorts = checked;
      state.cyclePortStatus = "idle";
      localStorage.setItem(CYCLE_PORT_STORAGE_KEY, checked ? "1" : "0");
      renderCyclePorts();
    }
  }));
  mapElementFilters.appendChild(mapElementButton({
    code:"☔",
    name:t("rainRadar"),
    count:rainRadarElementCount(),
    checked:state.showRainRadar,
    dotClass:"rain-radar-dot",
    onChange:setRainRadarEnabled
  }));
}

function renderFilters(){
  renderMapElementFilters();
  const areaFilters = document.getElementById("areaFilters");
  areaFilters.innerHTML = "";
  for(const area of DATA.areas || []){
    const count = DATA.counts && DATA.counts.byArea ? DATA.counts.byArea[area] || 0 : 0;
    areaFilters.appendChild(checkboxChip(`${AREA_LABELS[state.lang][area] || area} (${count})`, state.areas.has(area), checked=>{
      checked ? state.areas.add(area) : state.areas.delete(area);
      renderMarkers();
      renderConvenienceStores(true);
    }));
  }
}

function loadCenter(){
  try{
    const parsed = parseCoordinates(locationInput.value);
    setCenter(parsed.lat, parsed.lng, true);
    setStatusKey("centerLoaded");
  }catch(error){
    setStatusText(error.message || t("centerFailed"));
  }
}

function useGps(){
  if(!navigator.geolocation){setStatusKey("gpsUnavailable");return;}
  setStatusKey("locating");
  navigator.geolocation.getCurrentPosition(
    position=>{
      setCenter(position.coords.latitude, position.coords.longitude, true);
      setStatusKey("gpsSet");
    },
    error=>setStatusText(error.message || t("gpsFailed")),
    {enableHighAccuracy:true, timeout:10000}
  );
}

function updateDrawerShift(){
  const panel = document.querySelector(".panel");
  if(!panel) return;
  const reveal = 0;
  document.documentElement.style.setProperty("--panel-shift", `-${Math.max(0, panel.offsetWidth - reveal)}px`);
}

function setDrawerOpen(open){

  drawerToggle.setAttribute("aria-label", t(open ? "hidePanel" : "openPanel"));

function toggleDrawer(){

}

function applyLanguage(){

  html.lang = state.lang;
  document.title = t("docTitle");
  document.getElementById("map").setAttribute("aria-label", t("mapLabel"));
  document.querySelector(".panel").setAttribute("aria-label", t("panelLabel"));
  document.querySelector(".lang-switch").setAttribute("aria-label", t("languageLabel"));
  document.getElementById("langEn").classList.toggle("active", state.lang === "en");
  document.getElementById("langJa").classList.toggle("active", state.lang === "ja");
  document.getElementById("titleText").textContent = t("title");
  document.getElementById("updatedLabel").textContent = formatDate(DATA.generatedAt);
  document.getElementById("sourceLabel").textContent = `${(DATA.locations || []).length} ${t("stores")}`;
  document.getElementById("versionLabel").textContent = t("version", APP_VERSION);
  document.getElementById("centerLabel").textContent = t("centerLabel");
  document.getElementById("radiusLabel").textContent = t("radiusLabel");
  document.getElementById("paceLabel").textContent = t("paceLabel");
  document.getElementById("loadBtn").textContent = t("coordsButton");
  document.getElementById("gpsBtn").textContent = t("gpsButton");
  drawerToggle.setAttribute("aria-label", t(drawer.classList.contains("closed") ? "openPanel" : "hidePanel"));
  drawerToggleText.textContent = drawer.classList.contains("closed") ? ">" : "<";
  document.getElementById("mapElementsLabelText").textContent = t("mapElementsLabel");
  document.getElementById("mapElementsHint").textContent = `(${t("filterHint")})`;
  document.getElementById("areasLabel").textContent = t("areasLabel");
  updateBearingResetControl();
  updateSiteQrControl();
  document.querySelector(".route-draw-controls").setAttribute("aria-label", t("routeDrawLabel"));
  document.getElementById("routeDrawFootnote").textContent = t("routeDrawFootnote");
  renderRouteControls();
  if(state.lastStatusKey){
    statusEl.textContent = t(state.lastStatusKey, ...state.lastStatusArgs);
  }
  renderFilters();
  renderMajorStations();
  renderConvenienceStores(false);
  renderBathrooms(false);
  renderCyclePorts(false);
  updateRoute(false);
}

function setLanguage(lang){
  state.lang = lang === "ja" ? "ja" : "en";
  localStorage.setItem("runPlannerLang", state.lang);
  applyLanguage();
  renderMarkers(false);
}

function init(){
  map = L.map("map", {
    zoomControl:true,
    minZoom:7,
    maxZoom:18,
    rotate:true,
    touchRotate:true,
    shiftKeyRotate:true,
    rotateControl:false
  }).setView([state.lat, state.lng], 10);
  L.tileLayer(GSI_TILE_URL, {minZoom:7, maxZoom:18, attribution:GSI_ATTRIBUTION}).addTo(map);
  const rainRadarPane = map.createPane("rainRadarPane");
  rainRadarPane.style.zIndex = "425";
  rainRadarPane.style.pointerEvents = "none";
  addRouteVisualOverlay();
  addBearingResetControl();
  addSiteQrControl();
  if(map.attributionControl) map.attributionControl.addAttribution(BATHROOM_ATTRIBUTION);
  if(map.attributionControl) map.attributionControl.addAttribution(CYCLE_PORT_ATTRIBUTION);
  const majorStationPane = map.createPane("majorStationPane");
  majorStationPane.style.zIndex = "680";
  majorStationPane.style.pointerEvents = "none";
  majorStationLayer = L.layerGroup().addTo(map);
  bathroomLayer = L.layerGroup().addTo(map);
  cyclePortLayer = L.layerGroup().addTo(map);
  convenienceLayer = L.layerGroup().addTo(map);
  markerLayer = L.layerGroup().addTo(map);
  routeCircle = L.circle([state.lat, state.lng], {radius:state.radiusKm * 1000, color:"#1f8fff", weight:3, dashArray:"8 9", fillColor:"#22c55e", fillOpacity:.12}).addTo(map);
  centerMarker = L.marker([state.lat, state.lng], {draggable:true}).addTo(map);
  drawnRouteLine = L.polyline([], {color:"transparent", weight:18, opacity:0, className:"route-hit-target", bubblingMouseEvents:false});
  routePointLayer = L.layerGroup();
  const restoredRoute = loadSavedRoute();
  centerMarker.on("dragend", event=>{
    const latlng = event.target.getLatLng();
    setCenter(latlng.lat, latlng.lng, false);
    setStatusKey("centerMoved");
  });
  map.on("click", event=>{
    if(handleRouteMapClick(event)) return;
    if(routeIsVisible()) return;
    setCenter(event.latlng.lat, event.latlng.lng, false);
    setStatusKey("centerMoved");
  });
  map.on("contextmenu", event=>{
    if(state.routeMode === "drawing" || routeIsVisible()){
      showRouteMenu(event.latlng);
    }
  });
  map.on("zoomend moveend", ()=>{
    renderMajorStations();
    renderBathrooms();
    renderCyclePorts(state.showCyclePorts);
    renderConvenienceStores(state.convenienceBrands.size > 0);
  });
  applyLanguage();
  updateDrawerShift();
  setDrawerOpen(true);
  renderMajorStations();
  renderBathrooms();
  renderCyclePorts(false);
  renderConvenienceStores(false);
  renderMarkers(!restoredRoute);
  loadInitialLocationData();
  renderDrawnRoute();
  updateRoute(false);
  if(state.showRainRadar){
    refreshRainRadar();
    scheduleRainRadarRefresh();
  }
  if(restoredRoute){
    const bounds = drawnRouteLine.getBounds();
    if(bounds.isValid()) map.fitBounds(bounds, {padding:[45,45], maxZoom:DRAW_ZOOM});
    setStatusKey("routeRestored");
  }
}

document.getElementById("langEn").onclick = ()=>setLanguage("en");
document.getElementById("langJa").onclick = ()=>setLanguage("ja");
document.getElementById("loadBtn").onclick = loadCenter;
document.getElementById("gpsBtn").onclick = useGps;
routeDrawBtn.onclick = toggleRouteDraw;
routeUndoBtn.onclick = undoRoutePoint;
routeDoneBtn.onclick = completeRoute;
routeStartOverBtn.onclick = startOverRoute;
routeExportBtn.onclick = exportGpx;
drawerToggle.onclick = toggleDrawer;
populateRadiusOptions();
locationInput.addEventListener("keydown", event=>{if(event.key === "Enter"){event.preventDefault();loadCenter();}});
radiusInput.addEventListener("input", ()=>setRadius(radiusInput.value, false));
radiusInput.addEventListener("change", ()=>setRadius(radiusInput.value, true));
paceInput.addEventListener("input", ()=>updateRoute(false));
window.addEventListener("resize", updateDrawerShift);

if(window.L) init();
else setStatusKey("mapFailed");
</script>
</body>
</html>
